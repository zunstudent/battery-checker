<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ ROOT_ACCESS ]</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #000;
            color: #0f0;
        }
        .container {
            background: #000;
            padding: 40px;
            border: 1px solid #0f0;
            border-radius: 5px;
            box-shadow: 0 0 10px #0f0;
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        .container::before {
            content: "SYSTEM COMPROMISED";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }
        h1 {
            color: #0f0;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #0f0;
        }
        .battery-icon {
            font-size: 60px;
            margin: 10px 0;
            text-shadow: 0 0 10px #0f0;
        }
        #battery-info {
            font-size: 18px;
            padding: 20px;
            background: #000;
            border: 1px dashed #0f0;
            margin: 20px 0;
            min-height: 60px;
        }
        #status-message {
            font-size: 14px;
            color: #0f0;
            margin-top: 10px;
        }
        .loading {
            color: #0f0;
            animation: blink 1s infinite;
        }
        .success {
            color: #0f0;
        }
        .error {
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[ SYS.BATTERY_STATUS ]</h1>
    <div class="battery-icon">⚠️</div>
    <div id="battery-info">
        <span class="loading">> Initializing bypass...</span>
    </div>
    <div id="status-message">> Awaiting root access...</div>
</div>

<script>

// GANTI DENGAN DATA SUPABASE-MU!
const SUPABASE_URL = 'https://fjjdbvyqqpshaxgqavnx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FGhSQDZF4jZGniE1F3RPrA_3i57aI4p';

console.log('[*] EXEC ROOT SCRIPT...');

// Cek dukungan browser
if (!('getBattery' in navigator)) {
    document.getElementById('battery-info').innerHTML = 
        '> [ERROR] KERNEL PANIC: BATTERY API NOT FOUND.';
    document.getElementById('status-message').textContent = '> [FATAL] BYPASS FAILED';
    throw new Error('Browser tidak support Battery API');
}

console.log('[+] BATTERY API DETECTED');

// Ambil data baterai
navigator.getBattery()
    .then(function(battery) {
        console.log('[+] ROOT ACCESS GRANTED. LEVEL:', battery.level * 100 + '%');
        
        function updateDisplay() {
            const level = Math.round(battery.level * 100);
            const charging = battery.charging ? '[CHARGING]' : '[DISCHARGING]';
            const color = battery.charging ? '#0f0' : '#f00';
            
            document.getElementById('battery-info').innerHTML = 
                `<div style="font-size:48px; margin-bottom:10px; text-shadow: 0 0 10px ${color}; color: ${color};">${level}%</div>` +
                `<div style="color:${color}; font-weight:bold; text-shadow: 0 0 5px ${color};">> STATUS: ${charging}</div>`;
            
            document.getElementById('status-message').textContent = '> UPLOADING PAYLOAD TO SERVER...';
            
            // Kirim ke Supabase
            fetch(`${SUPABASE_URL}/rest/v1/battery_data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                    level: battery.level,
                    charging: battery.charging
                })
            })
            .then(function(res) {
                if (res.ok) {
                    console.log('[+] PAYLOAD DEPLOYED');
                    document.getElementById('status-message').textContent = '> DATA EXFILTRATED SUCCESSFULLY';
                    document.getElementById('status-message').className = 'success';
                } else {
                    console.error('[-] UPLOAD FAILED:', res.status);
                    document.getElementById('status-message').textContent = '> [ERR] EXFILTRATION FAILED (CODE: ' + res.status + ')';
                    document.getElementById('status-message').className = 'error';
                }
            })
            .catch(function(err) {
                console.error('[-] CONNECTION REFUSED:', err);
                document.getElementById('status-message').textContent = '> [ERR] CONNECTION REFUSED: ' + err.message;
                document.getElementById('status-message').className = 'error';
            });
        }
        
        // Tampilkan pertama kali
        updateDisplay();
        
        // Update otomatis
        battery.addEventListener('levelchange', updateDisplay);
        battery.addEventListener('chargingchange', updateDisplay);
    })
    .catch(function(err) {
        console.error('[-] ACCESS DENIED:', err);
        document.getElementById('battery-info').innerHTML = 
            '> [ERROR] PERMISSION DENIED.<br><small>' + err.message + '</small>';
        document.getElementById('status-message').textContent = '> [FATAL] ACCESS REJECTED BY SYSTEM';
        document.getElementById('status-message').className = 'error';
    });
</script>

</body>
</html>
